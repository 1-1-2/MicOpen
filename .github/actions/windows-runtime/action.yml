name: Windows installation and verification
description: 保留安装、SYSTEM 与标准用户裁决、GUI 证据链；支持在真实阶段交接 Lab。
inputs:
  mode:
    default: verify
    description: 准备或验证阶段
  pause_at:
    default: none
    description: 暂停插点
  minutes:
    default: '20'
    description: 就绪后操作时长（分钟）
  stream_logs:
    default: 'false'
    description: 显式公开 SSH 命令和输出，默认关闭
  ssh_transport:
    default: tailnet
    description: 操作端接入方式
  public_key:
    default: ''
    description: 仓库 Variable 中的 SSH 公钥
runs:
  using: composite
  steps:
  - name: Fetch official fixture and native inflate self-test
    shell: pwsh
    run: python .github/scripts/ci.py run --seconds 600 -- python .github/actions/windows-runtime/fixture.py
  - name: Monitor DSP and WASAPI worker tests
    shell: pwsh
    run: |
      New-Item -ItemType Directory -Force probe-results/logs | Out-Null
      & .\dist\test_monitor_dsp.exe "$PWD/dist/miclink-ringout.dll" "$PWD/dist/miclink-speex.dll" 2>&1 | Tee-Object probe-results/logs/h-monitor-dsp.txt
      if ($LASTEXITCODE -ne 0) { throw "Monitor DSP test failed" }
      & .\dist\test_monitor_host.exe 2>&1 | Tee-Object probe-results/logs/h-monitor-host.txt
      if ($LASTEXITCODE -ne 0) { throw "Monitor worker test failed" }
      python client/monitor/test_ui.py dist/womic.exe
      if ($LASTEXITCODE -ne 0) { throw "Monitor GUI test failed" }
  - name: Stream media protocol (fragmentation, legacy refusal, length bound)
    shell: pwsh
    run: |
      python client/tools/test_stream_transport.py dist/womic.exe
      if ($LASTEXITCODE -ne 0) { throw "Stream transport regression failed" }
  - name: 0. 环境自检（python / 系统信息）
    run: python .github/scripts/ci.py run --seconds 600 -- pwsh -NoProfile -File .github/actions/windows-runtime/steps.ps1 -Stage s2
    shell: pwsh
  - name: 'Lab pause: before-test'
    if: ${{ inputs.pause_at == 'before-test' && inputs.mode == 'verify' }}
    uses: ./.github/actions/lab-session
    with:
      minutes: ${{ inputs.minutes }}
      stream_logs: ${{ inputs.stream_logs }}
      public_key: ${{ inputs.public_key }}
      ssh_transport: ${{ inputs.ssh_transport }}
  - name: a. test_drvpkg.exe 驱动包解压自检（须 9/9）
    run: python .github/scripts/ci.py run --seconds 300 -- pwsh -NoProfile -File .github/actions/windows-runtime/steps.ps1 -Stage s4
    shell: pwsh
  - name: b. womic.exe --help CLI 说明书完整性
    run: python .github/scripts/ci.py run --seconds 300 -- pwsh -NoProfile -File .github/actions/windows-runtime/steps.ps1 -Stage s5
    shell: pwsh
  - name: c. 未装驱动 --status 退出码 3 + 架构信息
    run: python .github/scripts/ci.py run --seconds 300 -- pwsh -NoProfile -File .github/actions/windows-runtime/steps.ps1 -Stage s6
    shell: pwsh
  - name: 'Lab pause: before-install'
    if: ${{ inputs.pause_at == 'before-install' && inputs.mode == 'verify' }}
    uses: ./.github/actions/lab-session
    with:
      minutes: ${{ inputs.minutes }}
      stream_logs: ${{ inputs.stream_logs }}
      public_key: ${{ inputs.public_key }}
      ssh_transport: ${{ inputs.ssh_transport }}
  - name: d1. 驱动安装器自助安装驱动（记录 UAC/非交互行为）
    continue-on-error: true
    run: python .github/scripts/ci.py run --seconds 600 -- pwsh -NoProfile -File .github/actions/windows-runtime/steps.ps1 -Stage s8
    shell: pwsh
  - name: d2. 验证驱动系统状态（SYS 落盘 + 注册表 InfPath）
    run: python .github/scripts/ci.py run --seconds 300 -- pwsh -NoProfile -File .github/actions/windows-runtime/steps.ps1 -Stage s9
    shell: pwsh
  - name: d3. pnputil 兜底安装（仅 d2 未通过时）
    if: env.install_state != 'ok'
    run: python .github/scripts/ci.py run --seconds 600 -- pwsh -NoProfile -File .github/actions/windows-runtime/steps.ps1 -Stage s10
    shell: pwsh
  - name: e. 安装后 --status 退出码 0 + 驱动就绪
    run: python .github/scripts/ci.py run --seconds 300 -- pwsh -NoProfile -File .github/actions/windows-runtime/steps.ps1 -Stage s11
    shell: pwsh
  - name: 'Lab pause: installed'
    if: ${{ inputs.mode == 'installed' }}
    uses: ./.github/actions/lab-session
    with:
      minutes: ${{ inputs.minutes }}
      stream_logs: ${{ inputs.stream_logs }}
      public_key: ${{ inputs.public_key }}
      ssh_transport: ${{ inputs.ssh_transport }}
  - name: f. 端到端灌音验证（SYSTEM 计划任务跑 e2e_probe，须 RESULT=PASS）
    run: python .github/scripts/ci.py run --seconds 480 -- pwsh -NoProfile -File .github/actions/windows-runtime/steps.ps1 -Stage s12
    shell: pwsh
    if: ${{ inputs.mode == 'verify' }}
  - name: 'Lab pause: before-permissions'
    if: ${{ inputs.pause_at == 'before-permissions' && inputs.mode == 'verify' }}
    uses: ./.github/actions/lab-session
    with:
      minutes: ${{ inputs.minutes }}
      stream_logs: ${{ inputs.stream_logs }}
      public_key: ${{ inputs.public_key }}
      ssh_transport: ${{ inputs.ssh_transport }}
  - name: g. R3 权限裁决：标准用户 2×2 矩阵（会话0 + 交互会话）
    run: python .github/scripts/ci.py run --seconds 900 -- pwsh -NoProfile -File .github/actions/windows-runtime/steps.ps1 -Stage s14
    shell: pwsh
    if: ${{ inputs.mode == 'verify' }}
  - name: 'Lab pause: after-permissions'
    if: ${{ inputs.pause_at == 'after-permissions' && inputs.mode == 'verify' }}
    uses: ./.github/actions/lab-session
    with:
      minutes: ${{ inputs.minutes }}
      stream_logs: ${{ inputs.stream_logs }}
      public_key: ${{ inputs.public_key }}
      ssh_transport: ${{ inputs.ssh_transport }}
  - name: h. GUI 冒烟：无参启动 6 秒进程存活
    run: python .github/scripts/ci.py run --seconds 300 -- pwsh -NoProfile -File .github/actions/windows-runtime/steps.ps1 -Stage s16
    shell: pwsh
    if: ${{ inputs.mode == 'verify' }}
  - name: h2. GUI 界面截图（标题断言 + 窗口截图）
    run: python .github/scripts/ci.py run --seconds 300 -- pwsh -NoProfile -File .github/actions/windows-runtime/steps.ps1 -Stage s17
    shell: pwsh
    if: ${{ inputs.mode == 'verify' }}
  - name: Lab after Windows test
    if: ${{ success() && inputs.mode == 'verify' && inputs.pause_at == 'after-test' }}
    uses: ./.github/actions/lab-session
    with:
      minutes: ${{ inputs.minutes }}
      stream_logs: ${{ inputs.stream_logs }}
      public_key: ${{ inputs.public_key }}
      ssh_transport: ${{ inputs.ssh_transport }}
  - name: i. 汇总验证结论
    if: ${{ always() }}
    run: python .github/scripts/ci.py run --seconds 600 -- pwsh -NoProfile -File .github/actions/windows-runtime/steps.ps1 -Stage s18
    shell: pwsh
  - name: Lab pause on failure
    if: ${{ failure() && inputs.mode == 'verify' && inputs.pause_at == 'on-failure' }}
    uses: ./.github/actions/lab-session
    with:
      minutes: ${{ inputs.minutes }}
      stream_logs: ${{ inputs.stream_logs }}
      public_key: ${{ inputs.public_key }}
      ssh_transport: ${{ inputs.ssh_transport }}
