name: Android emulator and verification
description: 模拟器就绪、安装、UI 与协议闭环；保留硬超时和首次失败证据。
inputs:
  variant:
    default: release
    description: 待安装 APK 类型（debug 或 release）
  mode:
    default: verify
    description: 准备或验证阶段
  pause_at:
    default: none
    description: 暂停插点
  minutes:
    default: '20'
    description: 就绪后操作时长（分钟）
  stream_logs:
    default: 'false'
    description: 显式公开 SSH 命令和输出，默认关闭
  ssh_transport:
    default: tailnet
    description: 操作端接入方式
  public_key:
    default: ''
    description: 仓库 Variable 中的 SSH 公钥
runs:
  using: composite
  steps:
  - uses: ./.github/actions/android-tools
    with:
      purpose: emulator
  - name: Install emulator system dependencies
    run: python .github/scripts/ci.py run --seconds 600 -- bash .github/actions/android-runtime/steps.sh s5
    shell: bash
  - name: Verify KVM and AVD prerequisites
    run: python .github/scripts/ci.py run --seconds 180 -- bash .github/actions/android-runtime/steps.sh s6
    shell: bash
  - name: Start emulator (with timeout and progress logs)
    run: python .github/scripts/ci.py run --seconds 720 -- bash .github/actions/android-runtime/steps.sh s7
    shell: bash
  - name: Lab before Android install
    if: ${{ inputs.mode == 'verify' && inputs.pause_at == 'before-install' }}
    uses: ./.github/actions/lab-session
    with:
      minutes: ${{ inputs.minutes }}
      stream_logs: ${{ inputs.stream_logs }}
      public_key: ${{ inputs.public_key }}
      ssh_transport: ${{ inputs.ssh_transport }}
  - name: Install and launch app
    env:
      ANDROID_VARIANT: ${{ inputs.variant }}
    run: python .github/scripts/ci.py run --seconds 600 -- bash .github/actions/android-runtime/steps.sh s8
    shell: bash
  - name: Lab before Android test
    if: ${{ inputs.mode == 'verify' && inputs.pause_at == 'before-test' }}
    uses: ./.github/actions/lab-session
    with:
      minutes: ${{ inputs.minutes }}
      stream_logs: ${{ inputs.stream_logs }}
      public_key: ${{ inputs.public_key }}
      ssh_transport: ${{ inputs.ssh_transport }}
  - name: UI screenshots (5 screens + control asserts)
    run: python .github/scripts/ci.py run --seconds 300 -- bash .github/actions/android-runtime/steps.sh s9
    shell: bash
    if: ${{ inputs.mode == 'verify' }}
  - name: Interop closed loop (pc_client.py, retry once)
    run: python .github/scripts/ci.py run --seconds 360 -- bash .github/actions/android-runtime/steps.sh s11
    shell: bash
    if: ${{ inputs.mode == 'verify' }}
  - name: Collect diagnostics
    if: ${{ always() && inputs.mode == 'verify' }}
    continue-on-error: true
    env:
      DIAG_DIR: ${{ github.workspace }}/probe-results/diagnostics
      EMULATOR_LOG: ${{ github.workspace }}/probe-results/emulator.log
      INTEROP_DIR: ${{ github.workspace }}/probe-results/interop
    run: python .github/scripts/ci.py run --seconds 240 -- bash .github/actions/android-runtime/steps.sh s12
    shell: bash
  - name: Lab Android scene
    if: ${{ (success() && (inputs.mode == 'installed' || (inputs.mode == 'verify' && inputs.pause_at == 'after-test'))) || (failure() && inputs.mode == 'verify' && inputs.pause_at == 'on-failure') }}
    uses: ./.github/actions/lab-session
    with:
      minutes: ${{ inputs.minutes }}
      stream_logs: ${{ inputs.stream_logs }}
      public_key: ${{ inputs.public_key }}
      ssh_transport: ${{ inputs.ssh_transport }}
