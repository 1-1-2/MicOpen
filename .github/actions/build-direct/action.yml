name: Build native Wi-Fi Direct adapter
description: Windows SDK C++/WinRT module; isolated from the MinGW audio client.
runs:
  using: composite
  steps:
  - name: Compile Windows Wi-Fi Direct adapter
    shell: pwsh
    run: ./client/direct/build.ps1
  - name: Verify native adapter ABI and cancellation
    shell: pwsh
    run: |
      python client/direct/test_adapter.py client/build/miclink-direct.dll client/build/test_direct.dll
      if ($LASTEXITCODE -ne 0) { throw 'Direct ABI test failed' }
  - uses: actions/upload-artifact@v7
    with:
      name: build-direct-${{ github.run_id }}-${{ github.run_attempt }}
      path: client/build/miclink-direct.dll
      if-no-files-found: error
      retention-days: 3
