name: Dual Windows peer
description: 安装真实驱动、握手、推流、SYSTEM 440Hz 录音与双证据判定。
inputs:
  oauth_client_id:
    required: true
    description: CI 入网 OAuth 客户端 ID
  oauth_secret:
    required: true
    description: CI 入网 OAuth secret
  pause:
    default: 'false'
    description: 在双机就绪处开放操作窗口
  minutes:
    default: '20'
    description: 就绪后操作时长（分钟）
  stream_logs:
    default: 'false'
    description: 显式公开 SSH 命令和输出，默认关闭
  ssh_transport:
    default: tailnet
    description: 操作端接入方式
  public_key:
    default: ''
    description: 仓库 Variable 中的 SSH 公钥
  test_window_seconds:
    default: '1200'
    description: 等待对端完成的上限（秒）
  pause_at:
    default: none
    description: 暂停插点
runs:
  using: composite
  steps:
  - uses: tailscale/github-action@v4
    with:
      oauth-client-id: ${{ inputs.oauth_client_id }}
      oauth-secret: ${{ inputs.oauth_secret }}
      tags: tag:ci
      hostname: womic-dual-win-${{ github.run_id }}-${{ github.run_attempt }}
  - name: Prepare native driver fixture
    shell: pwsh
    run: python .github/scripts/ci.py run --seconds 600 -- python .github/actions/windows-runtime/fixture.py
  - name: 0. 环境自检（python / 系统信息 / 解锁产物）
    run: python .github/scripts/ci.py run --seconds 300 -- pwsh -NoProfile -File .github/actions/dual-windows/steps.ps1 -Stage s2
    shell: pwsh
  - name: B. 记录状态 + UDP 8126 入站放行
    run: python .github/scripts/ci.py run --seconds 600 -- pwsh -NoProfile -File .github/actions/dual-windows/steps.ps1 -Stage s4
    shell: pwsh
  - name: B. 发现 linux-app 的 tailnet IP（长轮询）
    run: python .github/scripts/ci.py run --seconds 3000 -- pwsh -NoProfile -File .github/actions/dual-windows/steps.ps1 -Stage s5
    shell: pwsh
  - name: C1. 驱动安装器自助安装驱动（记录 UAC/非交互行为）
    continue-on-error: true
    run: python .github/scripts/ci.py run --seconds 600 -- pwsh -NoProfile -File .github/actions/dual-windows/steps.ps1 -Stage s6
    shell: pwsh
  - name: C2. 验证驱动系统状态（SYS 落盘 + 注册表 InfPath）
    run: python .github/scripts/ci.py run --seconds 300 -- pwsh -NoProfile -File .github/actions/dual-windows/steps.ps1 -Stage s7
    shell: pwsh
  - name: C3. pnputil 兜底安装（仅 C2 未通过时）
    if: env.install_state != 'ok'
    run: python .github/scripts/ci.py run --seconds 600 -- pwsh -NoProfile -File .github/actions/dual-windows/steps.ps1 -Stage s8
    shell: pwsh
  - name: D. 安装后 --status 退出码 0 + 驱动就绪（硬门禁）
    run: python .github/scripts/ci.py run --seconds 300 -- pwsh -NoProfile -File .github/actions/dual-windows/steps.ps1 -Stage s9
    shell: pwsh
  - name: Optional dual Windows scene
    if: ${{ inputs.pause == 'true' }}
    uses: ./.github/actions/lab-session
    with:
      minutes: ${{ inputs.minutes }}
      stream_logs: ${{ inputs.stream_logs }}
      public_key: ${{ inputs.public_key }}
      ssh_transport: ${{ inputs.ssh_transport }}
      paired: 'true'
  - name: E. 跨网 TCP 通路就绪探活（hello）
    run: python .github/scripts/ci.py run --seconds 300 -- pwsh -NoProfile -File .github/actions/dual-windows/steps.ps1 -Stage s11
    shell: pwsh
  - name: F. 启动 SYSTEM 录音计划任务（440Hz 取证，30s）
    run: python .github/scripts/ci.py run --seconds 300 -- pwsh -NoProfile -File .github/actions/dual-windows/steps.ps1 -Stage s12
    shell: pwsh
  - name: G. 启动真 womic.exe（跨网 + 固定媒体端口 8126）
    run: python .github/scripts/ci.py run --seconds 300 -- pwsh -NoProfile -File .github/actions/dual-windows/steps.ps1 -Stage s13
    shell: pwsh
  - name: H. 读取录音取证判据（waveIn 440Hz）
    run: python .github/scripts/ci.py run --seconds 360 -- pwsh -NoProfile -File .github/actions/dual-windows/steps.ps1 -Stage s14
    shell: pwsh
  - name: I. 汇总判定（双证据链）
    run: python .github/scripts/ci.py run --seconds 180 -- pwsh -NoProfile -File .github/actions/dual-windows/steps.ps1 -Stage s15
    shell: pwsh
  - name: 收尾（移除媒体防火墙规则）
    if: always()
    run: python .github/scripts/ci.py run --seconds 180 -- pwsh -NoProfile -File .github/actions/dual-windows/steps.ps1 -Stage s17
    shell: pwsh
  - name: Lab dual final scene
    if: ${{ (success() && inputs.pause_at == 'after-test') || (failure() && inputs.pause_at == 'on-failure') }}
    uses: ./.github/actions/lab-session
    with:
      minutes: ${{ inputs.minutes }}
      stream_logs: ${{ inputs.stream_logs }}
      public_key: ${{ inputs.public_key }}
      ssh_transport: ${{ inputs.ssh_transport }}
